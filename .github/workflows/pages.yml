name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Overlay encrypted live files
        run: |
          if git ls-remote --exit-code --heads origin live-data >/dev/null; then
            git fetch --depth=1 origin live-data
            rm -rf web/live
            mkdir -p web/live
            git archive FETCH_HEAD | tar -x -C web/live
          fi
      - name: Upload web
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
